name: Secret Scan (2MS)

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Create artifacts directory
      - name: Create artifacts directory
        run: |
          mkdir -p artifacts

      # 3. Run 2MS - readable YAML report
      - name: Run 2MS - Text Report
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format yaml \
            --ignore-on-exit results \
            > artifacts/2ms-report.txt

      # 4. Run 2MS - SARIF report
      - name: Run 2MS - SARIF Report
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --ignore-on-exit results \
            > artifacts/2ms.sarif

      # 5. Display both reports
      - name: Check 2MS reports
        if: always()
        run: |
          echo "======================================"
          echo "2MS REPORT FILES"
          echo "======================================"

          ls -lah artifacts/

          echo ""
          echo "======================================"
          echo "2MS READABLE REPORT"
          echo "======================================"

          cat artifacts/2ms-report.txt

          echo ""
          echo "======================================"
          echo "2MS SARIF REPORT"
          echo "======================================"

          cat artifacts/2ms.sarif

      # 6. Upload both reports
      - name: Upload 2MS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-results
          path: artifacts/
          if-no-files-found: error
          retention-days: 30