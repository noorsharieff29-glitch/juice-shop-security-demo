name: KICS IaC Scan

on:
  push:
    branches:
      - master
      - security-demo
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  kics:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Create results directory
      - name: Create KICS results directory
        run: |
          mkdir -p kics-results

      # 3. Run KICS - JSON + SARIF + PDF
      - name: Run KICS scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/path" \
            checkmarx/kics:latest \
            scan \
            -p /path \
            -o /path/kics-results \
            --report-formats "json,sarif,pdf" \
            --output-name kics-report

      # 4. Show generated files
      - name: Show KICS results
        if: always()
        run: |
          echo "======================================"
          echo "KICS RESULTS"
          echo "======================================"

          find kics-results -type f -print

          echo ""
          echo "======================================"
          echo "SARIF FILES"
          echo "======================================"

          find kics-results -type f -name "*.sarif" -exec ls -lh {} \;

          echo ""
          echo "======================================"
          echo "PDF FILES"
          echo "======================================"

          find kics-results -type f -name "*.pdf" -exec ls -lh {} \;

      # 5. Verify SARIF
      - name: Verify KICS SARIF
        if: always()
        run: |
          SARIF_FILE=$(find kics-results -type f -name "*.sarif" | head -1)

          if [ -n "$SARIF_FILE" ]; then
            echo "SUCCESS: KICS SARIF generated:"
            echo "$SARIF_FILE"
            ls -lh "$SARIF_FILE"
          else
            echo "ERROR: KICS SARIF was not generated."
            find kics-results -type f
            exit 1
          fi

      # 6. Verify PDF
      - name: Verify KICS PDF
        if: always()
        run: |
          PDF_FILE=$(find kics-results -type f -name "*.pdf" | head -1)

          if [ -n "$PDF_FILE" ]; then
            echo "SUCCESS: KICS PDF generated:"
            echo "$PDF_FILE"
            ls -lh "$PDF_FILE"
          else
            echo "ERROR: KICS PDF was not generated."
            find kics-results -type f
            exit 1
          fi

      # 7. Upload KICS results
      - name: Upload KICS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kics-results
          path: kics-results/
          if-no-files-found: error
          retention-days: 30