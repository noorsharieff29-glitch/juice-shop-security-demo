name: Consolidated Security Summary

on:
  workflow_dispatch:

jobs:
  security-summary:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Create results directories
      # ==================================================

      - name: Create results directories
        run: |
          mkdir -p results/vorpal
          mkdir -p results/2ms
          mkdir -p results/kics
          mkdir -p results/zap


      # ==================================================
      # 3. Download Vorpal
      # ==================================================

      - name: Download Vorpal results
        uses: actions/download-artifact@v4
        with:
          name: vorpal-results
          path: results/vorpal
        continue-on-error: true


      # ==================================================
      # 4. Download 2MS
      # ==================================================

      - name: Download 2MS results
        uses: actions/download-artifact@v4
        with:
          name: 2ms-results
          path: results/2ms
        continue-on-error: true


      # ==================================================
      # 5. Download KICS
      # ==================================================

      - name: Download KICS results
        uses: actions/download-artifact@v4
        with:
          name: kics-results
          path: results/kics
        continue-on-error: true


      # ==================================================
      # 6. Download ZAP
      # ==================================================

      - name: Download ZAP results
        uses: actions/download-artifact@v4
        with:
          name: zap-results
          path: results/zap
        continue-on-error: true


      # ==================================================
      # 7. Show downloaded files
      # ==================================================

      - name: Show downloaded results
        run: |
          echo "======================================"
          echo "DOWNLOADED SECURITY RESULTS"
          echo "======================================"

          find results -type f -print || true

          echo ""
          echo "======================================"
          echo "SARIF FILES"
          echo "======================================"

          find results -type f -name "*.sarif" -print || true


      # ==================================================
      # 8. Generate consolidated report
      # ==================================================

      - name: Generate consolidated report
        shell: bash
        run: |

          set +e

          REPORT="security-summary.md"

          # ------------------------------------------------
          # Header
          # ------------------------------------------------

          echo "# Consolidated Security Report" > "$REPORT"
          echo "" >> "$REPORT"

          echo "**Repository:** $GITHUB_REPOSITORY" >> "$REPORT"
          echo "**Branch:** $GITHUB_REF_NAME" >> "$REPORT"
          echo "**Commit:** $GITHUB_SHA" >> "$REPORT"
          echo "**Generated:** $(date -u)" >> "$REPORT"

          echo "" >> "$REPORT"

          # ------------------------------------------------
          # Scanner coverage
          # ------------------------------------------------

          echo "## Scanner Coverage" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "| Scanner | Security Area | Status |" >> "$REPORT"
          echo "|---|---|---|" >> "$REPORT"


          # Vorpal

          if find results/vorpal -type f -name "*.sarif" | grep -q .; then
            echo "| Vorpal | SAST / Source Code | Available |" >> "$REPORT"
          else
            echo "| Vorpal | SAST / Source Code | No SARIF result |" >> "$REPORT"
          fi


          # 2MS

          if find results/2ms -type f -name "*.sarif" | grep -q .; then
            echo "| 2MS | Secret Scanning | Available |" >> "$REPORT"
          else
            echo "| 2MS | Secret Scanning | No SARIF result |" >> "$REPORT"
          fi


          # KICS

          if find results/kics -type f -name "*.sarif" | grep -q .; then
            echo "| KICS | Infrastructure as Code | Available |" >> "$REPORT"
          else
            echo "| KICS | Infrastructure as Code | No SARIF result |" >> "$REPORT"
          fi


          # ZAP

          if find results/zap -type f -name "*.sarif" | grep -q .; then
            echo "| ZAP | DAST / Running Application | Available |" >> "$REPORT"
          else
            echo "| ZAP | DAST / Running Application | No SARIF result |" >> "$REPORT"
          fi


          echo "" >> "$REPORT"


          # ==================================================
          # Findings Summary
          # ==================================================

          echo "## Findings Summary" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "| Scanner | Findings |" >> "$REPORT"
          echo "|---|---:|" >> "$REPORT"


          count_sarif() {

            DIRECTORY="$1"

            TOTAL=0

            while IFS= read -r -d '' FILE; do

              COUNT=$(jq -r '
                [
                  .runs[]?.results[]?
                ] | length
              ' "$FILE" 2>/dev/null)

              if [[ "$COUNT" =~ ^[0-9]+$ ]]; then
                TOTAL=$((TOTAL + COUNT))
              fi

            done < <(
              find "$DIRECTORY" \
                -type f \
                -name "*.sarif" \
                -print0 2>/dev/null
            )

            echo "$TOTAL"
          }


          VORPAL_COUNT=$(count_sarif results/vorpal)
          TWO_MS_COUNT=$(count_sarif results/2ms)
          KICS_COUNT=$(count_sarif results/kics)
          ZAP_COUNT=$(count_sarif results/zap)


          TOTAL=$(
            (
              VORPAL_COUNT +
              TWO_MS_COUNT +
              KICS_COUNT +
              ZAP_COUNT
            )
          )


          echo "| Vorpal | $VORPAL_COUNT |" >> "$REPORT"
          echo "| 2MS | $TWO_MS_COUNT |" >> "$REPORT"
          echo "| KICS | $KICS_COUNT |" >> "$REPORT"
          echo "| ZAP | $ZAP_COUNT |" >> "$REPORT"
          echo "| **Total** | **$TOTAL** |" >> "$REPORT"

          echo "" >> "$REPORT"


          # ==================================================
          # Severity Summary
          # ==================================================

          echo "## Severity Summary" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "| Severity | Findings |" >> "$REPORT"
          echo "|---|---:|" >> "$REPORT"


          for SEVERITY in critical high medium low; do

            COUNT=0

            while IFS= read -r -d '' FILE; do

              CURRENT=$(jq -r --arg severity "$SEVERITY" '
                [
                  .runs[]?.results[]?
                  |
                  .level?
                  |
                  ascii_downcase
                  |
                  select(. == $severity)
                ] | length
              ' "$FILE" 2>/dev/null)

              if [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
                COUNT=$((COUNT + CURRENT))
              fi

            done < <(
              find results \
                -type f \
                -name "*.sarif" \
                -print0 2>/dev/null
            )

            echo "| ${SEVERITY^} | $COUNT |" >> "$REPORT"

          done


          echo "" >> "$REPORT"


          # ==================================================
          # Individual Findings
          # ==================================================

          echo "## Individual Findings" >> "$REPORT"
          echo "" >> "$REPORT"


          for SCANNER in vorpal 2ms kics zap; do

            echo "### ${SCANNER^^}" >> "$REPORT"
            echo "" >> "$REPORT"

            FOUND=false

            while IFS= read -r -d '' FILE; do

              FOUND=true

              jq -r '
                .runs[]?.results[]?
                |
                "- **" +
                (
                  .ruleId //
                  .message.text //
                  "Unknown finding"
                ) +
                "** — Severity: " +
                (
                  .level //
                  "unknown"
                ) +
                " — " +
                (
                  .message.text //
                  "No description"
                )
              ' "$FILE" >> "$REPORT" 2>/dev/null || true

            done < <(
              find "results/$SCANNER" \
                -type f \
                -name "*.sarif" \
                -print0 2>/dev/null
            )


            if [ "$FOUND" = false ]; then
              echo "_No SARIF findings available._" >> "$REPORT"
            fi

            echo "" >> "$REPORT"

          done


          # ==================================================
          # Conclusion
          # ==================================================

          echo "## Conclusion" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "This report consolidates security findings from:" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "- Vorpal — SAST / Source Code" >> "$REPORT"
          echo "- 2MS — Secret Scanning" >> "$REPORT"
          echo "- KICS — Infrastructure as Code" >> "$REPORT"
          echo "- ZAP — DAST / Running Application" >> "$REPORT"

          echo "" >> "$REPORT"

          echo "> This report aggregates scanner outputs into a single view. It does not perform vulnerability correlation or deduplication." >> "$REPORT"


          # ==================================================
          # Verify report
          # ==================================================

          echo ""
          echo "======================================"
          echo "CONSOLIDATED REPORT"
          echo "======================================"

          if [ -f "$REPORT" ]; then

            echo "SUCCESS: $REPORT created."

            ls -lh "$REPORT"

            echo ""
            cat "$REPORT"

          else

            echo "ERROR: Report was not created."

          fi


      # ==================================================
      # 9. Upload consolidated report
      # ==================================================

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-security-report
          path: security-summary.md
          if-no-files-found: error
          retention-days: 30