name: Consolidated Security Summary

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  security-summary:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Create directories
      # ---------------------------------------------------

      - name: Create results directories
        run: |
          mkdir -p results/vorpal
          mkdir -p results/2ms
          mkdir -p results/kics
          mkdir -p results/zap


      # ---------------------------------------------------
      # 3. Download latest Vorpal artifact
      # ---------------------------------------------------

      - name: Download latest Vorpal results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          RUN_ID=$(gh run list \
            --workflow "vorpal.yml" \
            --status completed \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "Vorpal Run ID: $RUN_ID"

          if [ -n "$RUN_ID" ]; then

            gh run download "$RUN_ID" \
              --name vorpal-results \
              --dir results/vorpal

          else

            echo "No Vorpal workflow run found."

          fi


      # ---------------------------------------------------
      # 4. Download latest 2MS artifact
      # ---------------------------------------------------

      - name: Download latest 2MS results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          RUN_ID=$(gh run list \
            --workflow "2ms.yml" \
            --status completed \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "2MS Run ID: $RUN_ID"

          if [ -n "$RUN_ID" ]; then

            gh run download "$RUN_ID" \
              --name 2ms-results \
              --dir results/2ms

          else

            echo "No 2MS workflow run found."

          fi


      # ---------------------------------------------------
      # 5. Download latest KICS artifact
      # ---------------------------------------------------

      - name: Download latest KICS results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          RUN_ID=$(gh run list \
            --workflow "kics.yml" \
            --status completed \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "KICS Run ID: $RUN_ID"

          if [ -n "$RUN_ID" ]; then

            gh run download "$RUN_ID" \
              --name kics-results \
              --dir results/kics

          else

            echo "No KICS workflow run found."

          fi


      # ---------------------------------------------------
      # 6. Download latest ZAP artifact
      # ---------------------------------------------------

      - name: Download latest ZAP results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          RUN_ID=$(gh run list \
            --workflow "zap.yml" \
            --status completed \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "ZAP Run ID: $RUN_ID"

          if [ -n "$RUN_ID" ]; then

            gh run download "$RUN_ID" \
              --name zap-results \
              --dir results/zap

          else

            echo "No ZAP workflow run found."

          fi


      # ---------------------------------------------------
      # 7. Show downloaded files
      # ---------------------------------------------------

      - name: List security results
        run: |

          echo "======================================"
          echo "DOWNLOADED SECURITY RESULTS"
          echo "======================================"

          find results -type f -print


      # ---------------------------------------------------
      # 8. Generate consolidated report
      # ---------------------------------------------------

      - name: Generate consolidated report
        shell: bash
        run: |

          REPORT="security-summary.md"

          echo "# Consolidated Security Report" > "$REPORT"
          echo "" >> "$REPORT"

          echo "**Repository:** $GITHUB_REPOSITORY" >> "$REPORT"
          echo "**Commit:** $GITHUB_SHA" >> "$REPORT"
          echo "**Generated:** $(date -u)" >> "$REPORT"

          echo "" >> "$REPORT"

          # ------------------------------------------------
          # Scanner coverage
          # ------------------------------------------------

          echo "## Scanner Coverage" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "| Scanner | Security Area | Result |" >> "$REPORT"
          echo "|---|---|---|" >> "$REPORT"

          if find results/vorpal -type f 2>/dev/null | grep -q .; then
            echo "| Vorpal | SAST / Source Code | Available |" >> "$REPORT"
          else
            echo "| Vorpal | SAST / Source Code | No result |" >> "$REPORT"
          fi

          if find results/2ms -type f 2>/dev/null | grep -q .; then
            echo "| 2MS | Secrets | Available |" >> "$REPORT"
          else
            echo "| 2MS | Secrets | No result |" >> "$REPORT"
          fi

          if find results/kics -type f 2>/dev/null | grep -q .; then
            echo "| KICS | Infrastructure as Code | Available |" >> "$REPORT"
          else
            echo "| KICS | Infrastructure as Code | No result |" >> "$REPORT"
          fi

          if find results/zap -type f 2>/dev/null | grep -q .; then
            echo "| ZAP | DAST / Running Application | Available |" >> "$REPORT"
          else
            echo "| ZAP | DAST / Running Application | No result |" >> "$REPORT"
          fi

          echo "" >> "$REPORT"


          # ------------------------------------------------
          # Count SARIF findings
          # ------------------------------------------------

          echo "## Findings Summary" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "| Scanner | Findings |" >> "$REPORT"
          echo "|---|---:|" >> "$REPORT"

          count_sarif() {

            DIRECTORY="$1"
            TOTAL=0

            if [ -d "$DIRECTORY" ]; then

              while IFS= read -r -d '' FILE; do

                COUNT=$(jq '
                  [.runs[]?.results[]?] | length
                ' "$FILE" 2>/dev/null || echo 0)

                TOTAL=$((TOTAL + COUNT))

              done < <(
                find "$DIRECTORY" \
                  -type f \
                  -name "*.sarif" \
                  -print0
              )

            fi

            echo "$TOTAL"
          }


          VORPAL_COUNT=$(count_sarif results/vorpal)
          TWO_MS_COUNT=$(count_sarif results/2ms)
          KICS_COUNT=$(count_sarif results/kics)
          ZAP_COUNT=$(count_sarif results/zap)

          TOTAL=$(
            (
              VORPAL_COUNT +
              TWO_MS_COUNT +
              KICS_COUNT +
              ZAP_COUNT
            )
          )

          echo "| Vorpal | $VORPAL_COUNT |" >> "$REPORT"
          echo "| 2MS | $TWO_MS_COUNT |" >> "$REPORT"
          echo "| KICS | $KICS_COUNT |" >> "$REPORT"
          echo "| ZAP | $ZAP_COUNT |" >> "$REPORT"
          echo "| **Total** | **$TOTAL** |" >> "$REPORT"

          echo "" >> "$REPORT"


          # ------------------------------------------------
          # Severity summary
          # ------------------------------------------------

          echo "## Severity Summary" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "| Severity | Findings |" >> "$REPORT"
          echo "|---|---:|" >> "$REPORT"

          for severity in error warning note; do

            COUNT=0

            while IFS= read -r -d '' FILE; do

              CURRENT=$(jq -r --arg severity "$severity" '
                [
                  .runs[]?.results[]?
                  | .level?
                  | ascii_downcase
                  | select(. == $severity)
                ] | length
              ' "$FILE" 2>/dev/null || echo 0)

              COUNT=$((COUNT + CURRENT))

            done < <(
              find results \
                -type f \
                -name "*.sarif" \
                -print0
            )

            echo "| ${severity^} | $COUNT |" >> "$REPORT"

          done

          echo "" >> "$REPORT"


          # ------------------------------------------------
          # Scanner details
          # ------------------------------------------------

          echo "## Scanner Details" >> "$REPORT"
          echo "" >> "$REPORT"

          for scanner in vorpal 2ms kics zap; do

            echo "### ${scanner^^}" >> "$REPORT"
            echo "" >> "$REPORT"

            FOUND=false

            while IFS= read -r -d '' FILE; do

              FOUND=true

              jq -r '
                .runs[]?.results[]? |
                "- **" +
                (
                  .ruleId //
                  "Unknown finding"
                ) +
                "** — " +
                (
                  .message.text //
                  "No description"
                ) +
                " — Severity: " +
                (
                  .level //
                  "unknown"
                )
              ' "$FILE" >> "$REPORT" 2>/dev/null || true

            done < <(
              find "results/$scanner" \
                -type f \
                -name "*.sarif" \
                -print0 2>/dev/null
            )

            if [ "$FOUND" = false ]; then
              echo "_No SARIF results found._" >> "$REPORT"
            fi

            echo "" >> "$REPORT"

          done


          # ------------------------------------------------
          # Conclusion
          # ------------------------------------------------

          echo "## Conclusion" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "This report aggregates findings from Vorpal, 2MS, KICS and ZAP." >> "$REPORT"

          echo "" >> "$REPORT"

          echo "> Aggregation does not necessarily mean that findings have been correlated or deduplicated." >> "$REPORT"

          echo ""
          echo "======================================"
          echo "CONSOLIDATED REPORT"
          echo "======================================"

          cat "$REPORT"


      # ---------------------------------------------------
      # 9. Upload consolidated report
      # ---------------------------------------------------

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-security-report
          path: security-summary.md
          retention-days: 30