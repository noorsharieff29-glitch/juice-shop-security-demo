name: Vorpal Code Scan

on: [push, pull_request]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  vorpal:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Get all JavaScript files
      - name: Get JavaScript files
        id: js-files
        run: |
          FILES=$(find . \
            -type f \
            \( -name "*.js" -o -name "*.jsx" \) \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            | paste -sd "," -)

          echo "JavaScript files to scan:"
          echo "$FILES"

          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # 3. Run Vorpal
      - name: Run Vorpal
        if: steps.js-files.outputs.files != ''
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          source_path: "${{ steps.js-files.outputs.files }}"
          filter_mode: nofilter
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: info
          fail_on_error: false

      # 4. Create reports directory
      - name: Create reports directory
        if: always()
        run: |
          mkdir -p reports

      # 5. Create readable Vorpal report
      - name: Create Vorpal text report
        if: always()
        run: |

          echo "==================================================" > reports/vorpal-security-report.txt
          echo "             VORPAL SECURITY REPORT" >> reports/vorpal-security-report.txt
          echo "==================================================" >> reports/vorpal-security-report.txt
          echo "" >> reports/vorpal-security-report.txt

          echo "Repository : ${{ github.repository }}" >> reports/vorpal-security-report.txt
          echo "Branch     : ${{ github.ref_name }}" >> reports/vorpal-security-report.txt
          echo "Commit     : ${{ github.sha }}" >> reports/vorpal-security-report.txt
          echo "" >> reports/vorpal-security-report.txt

          echo "==================================================" >> reports/vorpal-security-report.txt
          echo "                 VORPAL FINDINGS" >> reports/vorpal-security-report.txt
          echo "==================================================" >> reports/vorpal-security-report.txt
          echo "" >> reports/vorpal-security-report.txt

          if [ -f all_results.errorformat ]; then

            echo "Raw Vorpal findings:" >> reports/vorpal-security-report.txt
            echo "" >> reports/vorpal-security-report.txt

            cat all_results.errorformat >> reports/vorpal-security-report.txt

          else

            echo "No Vorpal findings were generated." \
              >> reports/vorpal-security-report.txt

          fi

          echo "" >> reports/vorpal-security-report.txt
          echo "==================================================" \
            >> reports/vorpal-security-report.txt

          echo ""
          echo "========== VORPAL REPORT =========="
          cat reports/vorpal-security-report.txt

      # 6. Keep raw Vorpal output
      - name: Copy raw Vorpal results
        if: always()
        run: |

          if [ -f all_results.errorformat ]; then
            cp all_results.errorformat reports/vorpal-raw-results.txt
          else
            echo "No raw Vorpal results file was created." \
              > reports/vorpal-raw-results.txt
          fi

      # 7. Create SARIF file
      - name: Create Vorpal SARIF
        if: always()
        shell: bash
        run: |

          python3 <<'PY'
          import json
          import os
          import re

          input_file = "all_results.errorformat"
          output_file = "reports/vorpal.sarif"

          results = []

          if os.path.exists(input_file):

              with open(input_file, "r", errors="replace") as f:
                  lines = f.readlines()

              for line in lines:

                  line = line.strip()

                  if not line:
                      continue

                  # Expected errorformat is generally:
                  # file:line:column: message

                  match = re.match(
                      r"^(.*?):(\d+):(\d+):\s*(.*)$",
                      line
                  )

                  if match:

                      file_path = match.group(1)
                      line_number = int(match.group(2))
                      column_number = int(match.group(3))
                      message = match.group(4)

                      results.append({
                          "ruleId": "vorpal-finding",
                          "level": "warning",
                          "message": {
                              "text": message
                          },
                          "locations": [
                              {
                                  "physicalLocation": {
                                      "artifactLocation": {
                                          "uri": file_path
                                      },
                                      "region": {
                                          "startLine": line_number,
                                          "startColumn": column_number
                                      }
                                  }
                              }
                          ]
                      })

          sarif = {
              "$schema":
                  "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "Checkmarx Vorpal"
                          }
                      },
                      "results": results
                  }
              ]
          }

          with open(output_file, "w") as f:
              json.dump(sarif, f, indent=2)

          print(f"Created {output_file}")
          print(f"Findings converted to SARIF: {len(results)}")
          PY

      # 8. Validate/show SARIF
      - name: Check Vorpal SARIF
        if: always()
        run: |

          echo "======================================"
          echo "VORPAL SARIF"
          echo "======================================"

          ls -lah reports/

          echo ""
          cat reports/vorpal.sarif

      # 9. Upload all Vorpal results
      - name: Upload Vorpal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorpal-results
          path: reports/
          if-no-files-found: error
          retention-days: 30